Este é o arquivo de lock de migrações do Prisma. Ele garante consistência entre diferentes ambientes do projeto.

O que faz:
Trava o provider do banco de dados: Registra que você está usando PostgreSQL
Evita conflitos: Garante que todos os desenvolvedores e ambientes usem o mesmo tipo de banco
Controle de versão: Deve ser commitado no Git junto com as migrações

Não edite manualmente:
O Prisma gerencia este arquivo automaticamente. Ele é criado/atualizado quando você executa prisma migrate dev ou cria novas migrações.




# Please do not edit this file manually
# It should be added in your version-control system (i.e. Git)
provider = "postgresql"